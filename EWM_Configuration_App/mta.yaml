_schema-version: "3.3.0"
ID: EWM_Configuration_App
version: 1.0.0
description: "CAP + Fiori Elements with Approuter"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install --legacy-peer-deps
        - npx cds build --production
modules:
  # ---------------- BACKEND (CAP) ----------------
  - name: EWM_Configuration_App-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 256M
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: EWM_Configuration_App-db   
      - name: EWM_Configuration_App-alert-notification 
      - name: EWM_Configuration_App-auth 
  # ---------------- DATABASE ----------------
  - name: EWM_Configuration_App-db-deployer
    type: hdb
    path: gen/db
    parameters:
      memory: 256M
    requires:
      - name: EWM_Configuration_App-db
  # ---------------- APPRROUTER ----------------
  - name: EWM_Configuration_App-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 256M
    requires:
      - name: EWM_Configuration_App-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
resources:
  # ---------------- HANA DB ----------------
  - name: EWM_Configuration_App-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  # ---------------- ALERT NOTIFICATION ----------------
  - name: EWM_Configuration_App-alert-notification
    type: org.cloudfoundry.existing-service
    parameters:
      service: alert-notification
      service-name: alert_notification_ewm
      service-plan: standard

  - name: EWM_Configuration_App-auth
    type: org.cloudfoundry.existing-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: EWM_Configuration_App
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"