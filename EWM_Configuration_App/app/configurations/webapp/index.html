<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EWM Configurations</title>
  <style>
    html, body, body > div, #container, #container-uiarea {
      height: 100%;
    }
  </style>
  <script
    id="sap-ui-bootstrap"
    src="https://sapui5.hana.ondemand.com/1.146.0/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-resource-roots='{"ns.configurations": "./"}'
    data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
    data-sap-ui-compat-version="edge"
    data-sap-ui-language="en"
    data-sap-ui-async="false"
    data-sap-ui-frame-options="trusted">
  </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
  <div
    data-sap-ui-component
    data-name="ns.configurations"
    data-id="container"
    data-settings='{"id": "ns.configurations"}'
    data-handle-validation="true">
  </div>
</body>
</html>
